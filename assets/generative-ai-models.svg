<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title description">
  <title id="title">Exploring Generative AI: model families and modalities</title>
  <desc id="description">Six illustrated cards introduce language models, diffusion models, generative adversarial networks, variational autoencoders, multimodal models, and audio and speech models. These categories can overlap.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1728"/><stop offset="1" stop-color="#142538"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#9bb5d0" opacity=".11"/></pattern>
  </defs>
  <rect width="1440" height="680" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="680" rx="24" fill="url(#dots)"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="44" y="49" fill="#84ded3" font-size="14" letter-spacing="3">MODEL FAMILIES &amp; MODALITIES</text>
    <text x="42" y="97" fill="#f2f6ff" font-size="35" font-weight="700">Exploring Generative AI</text>
    <text x="44" y="128" fill="#a8bed3" font-size="17">From language and images to sound and multimodal systems.</text>

    <g fill="#14283c" stroke="#34516b"><rect x="44" y="163" width="428" height="216" rx="17"/><rect x="506" y="163" width="428" height="216" rx="17"/><rect x="968" y="163" width="428" height="216" rx="17"/><rect x="44" y="403" width="428" height="216" rx="17"/><rect x="506" y="403" width="428" height="216" rx="17"/><rect x="968" y="403" width="428" height="216" rx="17"/></g>

    <g transform="translate(69 186)" fill="none" stroke="#80dfcf" stroke-width="2.5" stroke-linecap="round"><rect width="45" height="40" rx="8"/><path d="M10 12h25M10 21h19M10 30h12M39 40l6 8v-13"/></g>
    <text x="129" y="211" fill="#86e2d3" font-size="12" letter-spacing="1.4">TEXT &amp; CODE</text>
    <text x="69" y="271" fill="#f0f6ff" font-size="24" font-weight="600">Language models</text>
    <text x="69" y="306" fill="#bdcde0" font-size="17">Transformers · Autoregressive generation</text>
    <text x="69" y="343" fill="#91adc3" font-size="15">Text, code and conversations.</text>

    <g transform="translate(531 186)" fill="#9dbaff"><circle cx="5" cy="7" r="2"/><circle cx="19" cy="3" r="3"/><circle cx="12" cy="22" r="3"/><circle cx="3" cy="37" r="2"/><circle cx="23" cy="36" r="2"/><circle cx="33" cy="15" r="2"/><path d="M42 20h13v3H42zM49 15l8 7-8 7v-4l4-3-4-3z"/><rect x="64" y="3" width="34" height="35" rx="7" fill="none" stroke="#9dbaff" stroke-width="2"/><path d="M69 29l7-9 7 6 5-8 6 11" fill="none" stroke="#9dbaff" stroke-width="2"/></g>
    <text x="649" y="211" fill="#b4c9ff" font-size="12" letter-spacing="1.4">IMAGES &amp; MORE</text>
    <text x="531" y="271" fill="#f0f6ff" font-size="24" font-weight="600">Diffusion models</text>
    <text x="531" y="306" fill="#bdcde0" font-size="17">Iterative denoising</text>
    <text x="531" y="343" fill="#91adc3" font-size="15">Generating images, video and audio.</text>

    <g transform="translate(993 186)" fill="none" stroke="#d0b2ff" stroke-width="2"><rect x="0" y="2" width="30" height="34" rx="7"/><rect x="55" y="2" width="30" height="34" rx="7"/><path d="M32 12h20m-6-5 6 5-6 5M53 27H33m6-5-6 5 6 5"/><text x="15" y="25" text-anchor="middle" fill="#d0b2ff" stroke="none" font-size="16">G</text><text x="70" y="25" text-anchor="middle" fill="#d0b2ff" stroke="none" font-size="16">D</text></g>
    <text x="1096" y="211" fill="#d0b2ff" font-size="12" letter-spacing="1.4">ADVERSARIAL LEARNING</text>
    <text x="993" y="271" fill="#f0f6ff" font-size="24" font-weight="600">Adversarial models (GANs)</text>
    <text x="993" y="306" fill="#bdcde0" font-size="17">Generator + discriminator</text>
    <text x="993" y="343" fill="#91adc3" font-size="15">Image synthesis and data generation.</text>

    <g transform="translate(69 426)" fill="none" stroke="#f4c686" stroke-width="2"><path d="M0 4h14l21 15-21 15H0zM90 4H76L55 19l21 15h14z"/><circle cx="45" cy="19" r="8"/><path d="M35 19h2m16 0h2"/></g>
    <text x="178" y="451" fill="#f4c686" font-size="12" letter-spacing="1.4">LATENT SPACES</text>
    <text x="69" y="511" fill="#f0f6ff" font-size="24" font-weight="600">Variational autoencoders</text>
    <text x="69" y="546" fill="#bdcde0" font-size="17">Encoding · Sampling · Decoding</text>
    <text x="69" y="583" fill="#91adc3" font-size="15">Representations and generative learning.</text>

    <g transform="translate(531 426)" fill="none" stroke="#8de0ef" stroke-width="2"><rect x="0" y="1" width="28" height="29" rx="5"/><path d="M5 23l7-9 6 5 5-8M42 5h24M42 14h17M42 23h21M77 7v15m6-21v27m6-17v7"/></g>
    <text x="639" y="451" fill="#8de0ef" font-size="12" letter-spacing="1.4">TEXT · VISION · AUDIO</text>
    <text x="531" y="511" fill="#f0f6ff" font-size="24" font-weight="600">Multimodal models</text>
    <text x="531" y="546" fill="#bdcde0" font-size="17">Learning across different modalities</text>
    <text x="531" y="583" fill="#91adc3" font-size="15">Connecting language, images and sound.</text>

    <g transform="translate(993 426)" stroke="#f0a9bc" stroke-width="3" stroke-linecap="round"><path d="M0 14v10M10 6v26M20 0v38M30 11v16M40 4v30M50 14v10M60 8v22M70 1v36M80 13v12"/></g>
    <text x="1095" y="451" fill="#f0a9bc" font-size="12" letter-spacing="1.4">SOUND &amp; VOICE</text>
    <text x="993" y="511" fill="#f0f6ff" font-size="24" font-weight="600">Audio &amp; speech models</text>
    <text x="993" y="546" fill="#bdcde0" font-size="17">Speech · Music · Voice generation</text>
    <text x="993" y="583" fill="#91adc3" font-size="15">Generating and working with sound.</text>

    <text x="44" y="654" fill="#849eb5" font-size="13">A general overview of model families and modalities. These categories can overlap.</text>
  </g>
</svg>
