    <g fill="#f0f6ff" font-size="20" font-weight="600"><text x="61" y="181">Image + question</text><text x="411" y="181">Vision-language model</text><text x="761" y="181">Image understanding</text><text x="1111" y="181">Compare the answers</text></g>
    <g fill="#b6c7da" font-size="16"><text x="61" y="218">Medical images and VQA</text><text x="61" y="247">What does the image show?</text><text x="411" y="218">Visual and language signals</text><text x="411" y="247">What drives the prediction?</text><text x="761" y="218">Medical images and features</text><text x="761" y="247">What can the model identify?</text><text x="1111" y="218">Errors, accuracy and cost</text><text x="1111" y="247">When does the model fail?</text></g>
