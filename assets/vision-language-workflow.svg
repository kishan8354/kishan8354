<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="350" viewBox="0 0 1440 350" role="img" aria-labelledby="title description">
  <title id="title">Research workflow: images, language and model evaluation</title>
  <desc id="description">Image and question, vision-language model, image understanding, and evaluation. Each step illustrates an area of research.</desc>
