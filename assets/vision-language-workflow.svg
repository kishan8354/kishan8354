  <rect width="1440" height="350" rx="22" fill="#0d1929"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="40" y="48" font-size="15" letter-spacing="2.2" fill="#89dcd3">THE RESEARCH QUESTIONS</text>
    <text x="40" y="81" font-size="22" fill="#edf3ff" font-weight="600">How do images and language work together?</text>
