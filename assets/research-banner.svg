<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title description">
  <title id="title">Kishan Kushavaha — Computer vision and multimodal AI</title>
  <desc id="description">A dark blue research banner with a stylized image grid connected to model nodes. Focus areas: vision-language models, visual grounding, hallucination research and generative AI.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b1427"/><stop offset="1" stop-color="#142a42"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#70e1da"/><stop offset="1" stop-color="#92b7ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8ba6c5" opacity=".16"/></pattern>
  </defs>
  <rect width="1440" height="400" rx="24" fill="url(#background)"/>
  <rect width="1440" height="400" rx="24" fill="url(#grid)"/>
  <path d="M56 64H128" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="56" y="112" fill="#8de4dd" font-size="15" letter-spacing="3">COMPUTER VISION · MULTIMODAL AI</text>
    <text x="52" y="180" fill="#f2f7ff" font-size="53" font-weight="700">Kishan Kushavaha</text>
    <text x="56" y="224" fill="#c0cee2" font-size="22">Understanding what models see.</text>
    <text x="56" y="258" fill="#c0cee2" font-size="22">Studying what their answers are grounded in.</text>
    <rect x="56" y="302" width="199" height="38" rx="19" fill="#203a50"/>
    <text x="155" y="326" fill="#9ce7df" text-anchor="middle" font-size="14">Visual grounding</text>
    <rect x="267" y="302" width="234" height="38" rx="19" fill="#233752"/>
    <text x="384" y="326" fill="#c6d9ff" text-anchor="middle" font-size="14">Hallucination research</text>
    <rect x="513" y="302" width="151" height="38" rx="19" fill="#293451"/>
    <text x="588" y="326" fill="#d4cdff" text-anchor="middle" font-size="14">Generative AI</text>
  </g>
  <g transform="translate(898 69)">
    <rect x="0" y="37" width="174" height="184" rx="18" fill="#102333" stroke="#4e7a98" stroke-width="1.5"/>
    <g fill="#264c61"><rect x="18" y="55" width="39" height="41" rx="4"/><rect x="65" y="55" width="39" height="41" rx="4"/><rect x="112" y="55" width="44" height="41" rx="4"/><rect x="18" y="104" width="39" height="48" rx="4"/><rect x="112" y="104" width="44" height="48" rx="4"/><rect x="18" y="160" width="39" height="43" rx="4"/><rect x="65" y="160" width="39" height="43" rx="4"/><rect x="112" y="160" width="44" height="43" rx="4"/></g>
    <rect x="65" y="104" width="39" height="48" rx="4" fill="#78e2d4"/>
    <path d="M84 123v11m-5-5h10" stroke="#173e49" stroke-width="2.5"/>
    <g fill="none" stroke="#79a7bf" stroke-width="1.3" opacity=".65"><path d="M176 83L251 47 331 106 251 164 331 227"/><path d="M176 129L251 47 331 227M176 129L251 164 331 106M176 180L251 47M176 180L251 164"/></g>
    <g fill="#18364d" stroke="#83c4d0" stroke-width="2"><circle cx="251" cy="47" r="14"/><circle cx="251" cy="164" r="14"/><circle cx="331" cy="106" r="14"/><circle cx="331" cy="227" r="14"/></g>
    <circle cx="251" cy="164" r="5" fill="#8de4dd"/>
    <path d="M348 106h44" stroke="#8de4dd" stroke-width="2"/>
    <rect x="390" y="79" width="65" height="56" rx="10" fill="#1e454e" stroke="#8de4dd"/>
    <path d="M407 107l10 10 20-24" fill="none" stroke="#a1eddf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b1c5d9" text-anchor="middle"><text x="86" y="252">IMAGE EVIDENCE</text><text x="296" y="276">MODEL SIGNALS</text><text x="422" y="160">GROUNDING</text></g>
  </g>
</svg>
